name: bank_platform_mobile
description: Application mobile de la plateforme bancaire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  image_picker: ^1.1.2
  firebase_messaging: ^15.0.2
  firebase_core: ^3.1.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  material_color_utilities: 0.13.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4 
  dartz: ^0.10.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  bloc_test: ^9.1.7
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Satisfy
      fonts:
        - asset: assets/fonts/Satisfy-Regular.ttf
          weight: 400
